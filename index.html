<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="app.css">
    <title>Document</title>
</head>

<body class="bg-purple-600 text-white overflow-hidden">

    <div class="relative">
        <div class="container mx-auto p-4 flex flex-col items-center justify-center min-h-screen">
            <h1 class="border p-5 border-4 rounded-md text-8xl font-extrabold mb-4 animate__animated animate__pulse animate__infinite"
                id="timer"></h1>

            <div id="kata-ultah"
                class="hidden p-4 flex flex-col justify-center items-center gap-8 animate__animated animate__zoomInDown">
                <i class="fa-solid fa-cake-candles text-9xl"></i>
                <p class="max-w-5xl mt-8 font-semibold text-justify leading-9">
                    <span class="text-4xl font-bold">
                        Happy Birthday Sayang ku 🎉,
                    </span>
                    Terima kasih sudah menjadi bagian terindah dalam hidupku. Semoga semua impianmu dan harapanmu
                    tercapai, Kesehatan dan kebahagian selalu menyertaimu. Aku bersyukur mengenal dan mencintaimu.
                    <span class="text-4xl font-bold">Love U Sayangku 🥰</span>
                </p>
            </div>
        </div>

        <div class="w-full h-min-screen absolute z-100 left-0 top-0 bg-red-600 hidden" id="petasan">
            <div class="pyro">
                <div class="before"></div>
                <div class="after"></div>
            </div>
        </div>
    </div>
    <script>
        // Hitung mundur dari hari ini sampai tanggal yang ditetapkan
        const targetDate = new Date("2026-06-11T00:00:00").getTime();
        const timerElement = document.getElementById("timer");

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            if (distance < 0) {
                timerElement.innerHTML = "Waktu telah habis!";

                // Tampilkan petasan dan kata-ultah setelah waktu habis
                document.getElementById("petasan").classList.remove("hidden");
                document.getElementById("kata-ultah").classList.remove("hidden");
                document.getElementById("timer").classList.add("hidden");
                let body = document.getElementsByTagName("body")[0];
                body.classList.remove("bg-purple-600");
                body.classList.add("bg-black");

                clearInterval(timerInterval);
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            timerElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;


        }
        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer(); // Update timer segera saat halaman dimuat


        // =============================================================

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const fireworks = [];
        const particles = [];

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * canvas.height / 2;
                this.speed = 3;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            }

            update() {
                this.y -= this.speed;
                if (this.y <= this.targetY) {
                    this.explode();
                    return true;
                }
                this.draw();
                return false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            explode() {
                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(this.x, this.y, this.color));
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.speed = Math.random() * 4 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.color = color;
                this.alpha = 1;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.alpha -= 0.02;
                this.draw();
                return this.alpha <= 0;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.03) {
                fireworks.push(new Firework());
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                if (fireworks[i].update()) {
                    fireworks.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                if (particles[i].update()) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });


    </script>
</body>

</html>
